# ARTETOSCO — despliegue estático en Netlify
# Sitio 100% HTML5 + CSS3 + JavaScript ES6. Sin build, sin Node en producción.

[build]
  publish = "public/site"
  command = ""

# Mantiene las URLs con .html para que coincidan con los enlaces internos
# y con las etiquetas canonical (evita redirecciones innecesarias).
[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/site/*"
  to = "/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
